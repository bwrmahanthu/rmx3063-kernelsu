name: Build Realme C20 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex
          sudo apt-get install -y libssl-dev libelf-dev libncurses-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y python2 zip curl wget gzip
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Proton Clang Toolchain
        run: |
          CLANG_URL="https://github.com/kdrag0n/proton-clang.git"
          git clone --depth=1 $CLANG_URL "$GITHUB_WORKSPACE/clang"

      - name: Clone Realme C20 Kernel Source
        run: |
          SRC="https://github.com/realme-kernel-opensource/realme_C20-C21-AndroidQ-kernel-source.git"
          git clone --depth=1 -b master $SRC "$GITHUB_WORKSPACE/kernel"

      - name: Integrate KernelSU
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          KSU_URL="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
          curl -LSs $KSU_URL -o setup.sh
          bash setup.sh v0.9.5
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Configure defconfig
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          DEFCONFIG="arch/arm64/configs/oppo6765_defconfig"
          echo "Patching defconfig: $DEFCONFIG"
          
          # Fix compiler compatibility for modern Clang & GCC on Linux 4.9
          echo "exit 0" > scripts/clang-android.sh
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' "$DEFCONFIG"
          sed -i 's/-Werror=unknown-warning-option//g' Makefile
          sed -i 's/-no-integrated-as//g' Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /' Makefile
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
          sed -i 's/clock_gettime_return,/clock_gettime_return/g' arch/arm64/kernel/vdso/gettimeofday.S
          sed -i 's|cmd_vdsold = $(CC) $(c_flags)|cmd_vdsold = $(CC) $(c_flags) -fuse-ld=/usr/bin/aarch64-linux-gnu-ld|g' arch/arm64/kernel/vdso/Makefile

          # Append KernelSU flags
          cat << 'EOF' >> "$DEFCONFIG"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          EOF

      - name: Compile Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- oppo6765_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Repack boot.img
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" ]; then
            KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"
          else
            KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image"
          fi
          echo "Found compiled kernel at: $KERNEL_BIN"
          cp "$KERNEL_BIN" "$GITHUB_WORKSPACE/output/Image.gz"

          if [ -f "$GITHUB_WORKSPACE/boot.img.gz" ]; then
            echo "Decompressing boot.img.gz..."
            gzip -d "$GITHUB_WORKSPACE/boot.img.gz"
          fi

          if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
            echo "Repacking boot.img..."
            cd "$GITHUB_WORKSPACE"
            M_URL="https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
            wget -q $M_URL -O magisk.apk
            unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
            chmod +x magiskboot
            ./magiskboot unpack boot.img
            cp "$KERNEL_BIN" kernel
            ./magiskboot repack boot.img "$GITHUB_WORKSPACE/output/boot-kernelsu.img"
            echo "Done repacking!"
          fi

      - name: Upload Finished Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme-C20-KernelSU
          path: output/*
