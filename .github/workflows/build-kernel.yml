.github/workflows/build-kernel.yml                                                     
  
    name: Build Realme C20 KernelSU
  
    on:
      workflow_dispatch:
  
    jobs:
      build:
        runs-on: ubuntu-20.04
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
  
          - name: Set up Environment & Dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y git build-essential bc bison flex libssl-dev          
              libelf-dev \
                gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5-dev libncurses5 \   
                python-is-python3 zip curl wget gzip
  
          - name: Download Proton Clang Toolchain
            run: |                                                                          
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git               
              "$GITHUB_WORKSPACE/clang"
  
          - name: Clone Realme MT6765 Kernel Source
            run: |
              git clone --depth=1
              https://github.com/realme-mediatek-dev/android_kernel_realme_mt6765.git \     
                -b alps-mp-r0.mp1.tc16sp-pr4-V1_k65v1_64 "$GITHUB_WORKSPACE/kernel"         
  
          - name: Integrate KernelSU (v0.9.5 Legacy)
            run: |
              cd "$GITHUB_WORKSPACE/kernel"
              curl -LSs
              "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash
              -s v0.9.5
              
              # Hook KernelSU into drivers Kconfig & Makefile if missing
              if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
                sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig       
              fi
              if ! grep -q "kernelsu" drivers/Makefile; then
                echo "obj-y += kernelsu/" >> drivers/Makefile
              fi
  
          - name: Configure defconfig (Enable KSU & Kprobes)
            run: |
              cd "$GITHUB_WORKSPACE/kernel"
              
              # Detect the correct defconfig file
              if [ -f "arch/arm64/configs/oppo6765_defconfig" ]; then
                DEFCONFIG="arch/arm64/configs/oppo6765_defconfig"
              else
                DEFCONFIG=$(find arch/arm64/configs/ -name "*6765*defconfig" | head -n 1)   
              fi
              echo "Selected defconfig: $DEFCONFIG"
  
              # Append mandatory configs for KernelSU
              cat << 'EOF' >> "$DEFCONFIG" 
              CONFIG_KSU=y
              CONFIG_KPROBES=y 
              CONFIG_HAVE_KPROBES=y
              CONFIG_KRETPROBES=y
              CONFIG_OVERLAY_FS=y
              EOF 
  
          - name: Compile Kernel
            run: |
              cd "$GITHUB_WORKSPACE/kernel" 
              export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
              export ARCH=arm64 
              export SUBARCH=arm64
              export CROSS_COMPILE=aarch64-linux-gnu- 
              export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              
              # Make configuration                                                          
              make O=out oppo6765_defconfig                                                 
                                                                                            
              # Compile with Clang                                                          
              make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu-                
                                                                                            
          - name: Repack boot.img                                                           
            run: |                                                                          
              mkdir -p "$GITHUB_WORKSPACE/output"                                           
                                                                                            
              # Find compiled kernel binary                                                 
              if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then   
                KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"      
              elif [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" ]; then     
                KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"          
              else                                                                          
                KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image"             
              fi                                                                            
                                                                                            
              echo "Found compiled kernel at: $KERNEL_BIN"                                  
              cp "$KERNEL_BIN" "$GITHUB_WORKSPACE/output/Image.gz"                          
                                                                                            
              # Decompress boot.img.gz if uploaded                                          
              if [ -f "$GITHUB_WORKSPACE/boot.img.gz" ]; then                               
                echo "Decompressing boot.img.gz..."                                         
                gzip -d "$GITHUB_WORKSPACE/boot.img.gz"                                     
              fi                                                                            
                                                                                            
              # If base boot.img exists, unpack and repack with new kernel                  
              if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then                                  
                echo "Repacking boot.img with new KernelSU kernel..."                       
                cd "$GITHUB_WORKSPACE"                                                      
                                                                                            
                # Fetch magiskboot tool                                                     
                wget -q                                                                     
                https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
                unzip -p Magisk-v27.0.apk lib/x86_64/libmagiskboot.so > magiskboot          
                chmod +x magiskboot
                
                # Unpack, replace kernel binary, and repack
                ./magiskboot unpack boot.img
                cp "$KERNEL_BIN" kernel
                ./magiskboot repack boot.img "$GITHUB_WORKSPACE/output/boot-kernelsu.img"   
                echo "Successfully generated boot-kernelsu.img!"
              else
                echo "No base boot.img found in repo root. Upload boot.img.gz to get a      
                ready-to-flash image."
              fi
  
          - name: Upload Finished Artifacts
            uses: actions/upload-artifact@v4
            with:
              name: Realme-C20-KernelSU
              path: output/*
