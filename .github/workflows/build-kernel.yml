name: Build Realme C20 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex
          sudo apt-get install -y libssl-dev libelf-dev libncurses-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y python2 zip curl wget gzip
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Proton Clang Toolchain
        run: |
          CLANG_URL="https://github.com/kdrag0n/proton-clang.git"
          git clone --depth=1 $CLANG_URL "$GITHUB_WORKSPACE/clang"

      - name: Clone Realme C20 Kernel Source
        run: |
          SRC="https://github.com/realme-kernel-opensource/realme_C20-C21-AndroidQ-kernel-source.git"
          git clone --depth=1 -b master $SRC "$GITHUB_WORKSPACE/kernel"

      - name: Integrate KernelSU
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          KSU_URL="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
          curl -LSs $KSU_URL -o setup.sh
          bash setup.sh v0.9.5
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Configure defconfig
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          export TARGET_PRODUCT=full_oppo6765
          DEFCONFIG="arch/arm64/configs/oppo6765_defconfig"
          echo "Patching defconfig: $DEFCONFIG"
          
          # Fix compiler compatibility for modern Clang & GCC on Linux 4.9
          echo "exit 0" > scripts/clang-android.sh
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' "$DEFCONFIG"
          sed -i 's/-Werror=unknown-warning-option//g' Makefile
          sed -i 's/-no-integrated-as//g' Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /' Makefile
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
          sed -i 's/clock_gettime_return,/clock_gettime_return/g' arch/arm64/kernel/vdso/gettimeofday.S
          sed -i 's|cmd_vdsold = $(CC) $(c_flags)|cmd_vdsold = $(CC) $(c_flags) -fuse-ld=/usr/bin/aarch64-linux-gnu-ld|g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/v0\.4s\[0\]/v0.s[0]/g' arch/arm64/crypto/aes-ce-cipher-core.c
          sed -i 's/_ASM_EXTABLE/_asm_extable/g' arch/arm64/include/asm/alternative.h
          python3 -c "import base64; exec(base64.b64decode(''))"
          python3 -c "import base64; exec(base64.b64decode(''))"

          # Copy real oppo_phoenix header to expected vendor path
          PHOENIX_DIR="$GITHUB_WORKSPACE/vendor/oppo/oppo_phoenix/kernel/oppo_phoenix"
          mkdir -p "$PHOENIX_DIR"
          cp "$GITHUB_WORKSPACE/kernel/drivers/soc/oppo/oppo_phoenix/oppo_phoenix.h" "$PHOENIX_DIR/oppo_phoenix.h"

          # Remove -Werror and fix misleading indentation in sound/drivers
          find sound/ drivers/ -name Makefile -exec sed -i 's/-Werror//g' {} +
          sed -i 's/-Werror=strict-prototypes//g' Makefile
          sed -i 's/-Werror=implicit-int//g' Makefile
          sed -i 's/-Werror=incompatible-pointer-types//g' Makefile
          sed -i 's/KBUILD_CFLAGS   += $(ARCH_CFLAGS)   $(KCFLAGS)/KBUILD_CFLAGS   += $(ARCH_CFLAGS)   $(KCFLAGS) -Wno-error -Wno-misleading-indentation -fno-builtin-stpcpy/' Makefile
          python3 -c "import base64; exec(base64.b64decode(''))"

          # Fix memcpy, memmove, memset changed binding to STB_GLOBAL for Clang IAS
          python3 -c "import base64; exec(base64.b64decode(''))"

          # Fix old-style function prototypes in camera sensor driver
          sed -i 's/void hi556_otp_read_enable()/void hi556_otp_read_enable(void)/g' drivers/misc/mediatek/cam_cal/src/mt6765/otp_insensor_dev.c
          sed -i 's/void hi556_otp_read_disable()/void hi556_otp_read_disable(void)/g' drivers/misc/mediatek/cam_cal/src/mt6765/otp_insensor_dev.c

          # Align .builtin_fw to 8 bytes in linker script to satisfy R_AARCH64_LDST64 relocation
          python3 -c "import base64; exec(base64.b64decode(''))"

          # Implement stpcpy for Clang 12+ libcall optimization
          python3 -c "import base64; exec(base64.b64decode(''))"

          # Fix UB: remove const from all lcm_utils in ddp_dsi.c so compiler does not zero-out or place in rodata
          sed -i 's/static const struct LCM_UTIL_FUNCS lcm_utils_/static struct LCM_UTIL_FUNCS lcm_utils_/g' drivers/misc/mediatek/video/mt6765/dispsys/ddp_dsi.c
          sed -i 's/static const struct LCM_UTIL_FUNCS lcm_utils_/static struct LCM_UTIL_FUNCS lcm_utils_/g' drivers/misc/mediatek/video/mt6779/dispsys/ddp_dsi.c
          sed -i 's/const struct LCM_UTIL_FUNCS PM_lcm_utils_/struct LCM_UTIL_FUNCS PM_lcm_utils_/g' drivers/misc/mediatek/video/mt6765/dispsys/ddp_dsi.c
          sed -i 's/const struct LCM_UTIL_FUNCS PM_lcm_utils_/struct LCM_UTIL_FUNCS PM_lcm_utils_/g' drivers/misc/mediatek/video/mt6779/dispsys/ddp_dsi.c

          # Fix NULL function pointer calls across all LCM panel drivers
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|lcm_util\.dsi_set_cmdq_V2(cmd, count, ppara, force_update)|do { if (lcm_util.dsi_set_cmdq_V2) lcm_util.dsi_set_cmdq_V2(cmd, count, ppara, force_update); } while (0)|g' {} +
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|lcm_util\.dsi_set_cmdq_V22(cmdq, cmd, count, ppara, force_update)|do { if (lcm_util.dsi_set_cmdq_V22) lcm_util.dsi_set_cmdq_V22(cmdq, cmd, count, ppara, force_update); } while (0)|g' {} +
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|lcm_util\.dsi_set_cmdq(pdata, queue_size, force_update)|do { if (lcm_util.dsi_set_cmdq) lcm_util.dsi_set_cmdq(pdata, queue_size, force_update); } while (0)|g' {} +
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|lcm_util\.dsi_write_cmd(cmd)|do { if (lcm_util.dsi_write_cmd) lcm_util.dsi_write_cmd(cmd); } while (0)|g' {} +
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|lcm_util\.dsi_write_regs(addr, pdata, byte_nums)|do { if (lcm_util.dsi_write_regs) lcm_util.dsi_write_regs(addr, pdata, byte_nums); } while (0)|g' {} +
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|(lcm_util\.mdelay(n))|((lcm_util.mdelay) ? lcm_util.mdelay(n) : mdelay(n))|g' {} +
          find drivers/misc/mediatek/lcm/ -name "*.c" -exec sed -i 's|(lcm_util\.udelay(n))|((lcm_util.udelay) ? lcm_util.udelay(n) : udelay(n))|g' {} +

          # Append KernelSU flags
          cat << 'EOF' >> "$DEFCONFIG"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          EOF

      - name: Compile Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export TARGET_PRODUCT=full_oppo6765
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- oppo6765_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-Wno-error -Wno-misleading-indentation"

      - name: Repack boot.img
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" ]; then
            KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz"
          else
            KERNEL_BIN="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image"
          fi
          echo "Found compiled kernel at: $KERNEL_BIN"
          cp "$KERNEL_BIN" "$GITHUB_WORKSPACE/output/Image.gz"

          if [ -f "$GITHUB_WORKSPACE/boot.img.gz" ]; then
            echo "Decompressing boot.img.gz..."
            gzip -dc "$GITHUB_WORKSPACE/boot.img.gz" > "$GITHUB_WORKSPACE/boot.img"
          fi

          if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
            echo "Repacking boot.img in /tmp/repack..."
            rm -rf /tmp/repack
            mkdir -p /tmp/repack
            cd /tmp/repack

            M_URL="https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
            wget -q $M_URL -O magisk.apk
            unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
            chmod +x magiskboot

            cp "$GITHUB_WORKSPACE/boot.img" boot.img
            ./magiskboot unpack boot.img

            if ./magiskboot split "$KERNEL_BIN"; then
              echo "Successfully split compiled Image.gz-dtb into kernel and kernel_dtb!"
            else
              echo "Using compiled kernel directly as kernel component..."
              cp "$KERNEL_BIN" kernel
            fi

            ./magiskboot repack boot.img new-boot.img
            cp new-boot.img "$GITHUB_WORKSPACE/output/boot-kernelsu.img"
            echo "Done repacking! Output saved to $GITHUB_WORKSPACE/output/boot-kernelsu.img"
            cd "$GITHUB_WORKSPACE/output"
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Upload Finished Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme-C20-KernelSU
          path: output/*
